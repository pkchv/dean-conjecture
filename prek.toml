[[repos]]
repo = "local"

[[repos.hooks]]
id = "build-paper"
name = "build paper"
entry = "sh -c './scripts/build-paper.sh && git add -- paper/Dean_conjecture_k5.pdf paper/Dean_conjecture_k5.tex'"
language = "system"
files = '^(paper/Dean_conjecture_k5[.]md|scripts/build-paper[.]sh)$'
pass_filenames = false

[[repos.hooks]]
id = "verify-lean"
name = "verify Lean formalization"
entry = "./scripts/verify-lean.sh"
language = "system"
always_run = true
pass_filenames = false
