name: Lean verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and audit the Lean proof
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Lean and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true

      - name: Verify the Lean formalization
        run: ./scripts/verify-lean.sh
